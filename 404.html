<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面不存在</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<style>
:root{--ink:#0b0b0c;--paper:#f4f4f2;--ink-3:#6b6b73;--line:#e6e6e2;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#f3f3f0;--paper:#0a0a0b;--ink-3:#98989f;--line:#232327}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:var(--sans);padding:32px}
.box{max-width:520px;width:100%}
.code{font-family:var(--mono);font-size:clamp(72px,16vw,128px);font-weight:700;line-height:.9;letter-spacing:-.06em}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:22px 0 0}
p{margin:10px 0 0;color:var(--ink-3);font-size:14px;line-height:1.8}
hr{border:0;border-top:1px solid var(--line);margin:30px 0}
a{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:13px;text-decoration:none;transition:all .2s ease}
a:hover{background:transparent;color:var(--ink)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>这个页面不存在</h1>
  <p>地址可能写错了，或者内容已经挪走。</p>
  <hr>
  <a href="/">← 回到首页</a>
</div>
</body>
</html>
